spring.application.name=Banking

# Points to our Database -
# NOTE: you'll need a postgres DB and a "games" schema before this works!
spring.datasource.url=jdbc:mysql://localhost:3306/banking

# Using the Postgres Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Credentials (hardcoded, not great)
spring.datasource.username=root
spring.datasource.password=Tarploe1

# Shows any SQL running in your console - great for debugs
spring.jpa.show-sql=true

# Telling Spring Data we want to use Postgres
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# The DDL config for what happens when we run our app
# update == any changes to the DB entities change in the Database
# create == the entire DB gets wiped and recreated
spring.jpa.hibernate.ddl-auto=update

# Logback Configs

logging.level.org.springframework.boot.autoconfigure=ERROR
logging.level.root=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.hibernate=WARN
logging.level.com.revature=DEBUG