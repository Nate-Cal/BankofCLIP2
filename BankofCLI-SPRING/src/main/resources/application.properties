spring.application.name=BankofCLI

# Pointing to our Database
# NOTE: Have to set up ENV Variables for Windows User - Nate's Mac will Run a Local DB 
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=bankofcli

#Using the Postgres Driver
spring.datasource.driver-class-name=org.postgresql.Driver

#Credentials (HARDCODED, FOR DEVELOPMENT ONLY)
spring.datasource.username=postgres
spring.datasource.password=password

# Shows any SQL running in your console - great for debugging --- THANK YOU BEN
spring.jpa.show-sql=true

# Telling Spring Data we want to use Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# The DDL config for what happens when we run our app
# update == any changes to the DB entities change in the Database
# create == the entire DB gets wiped and recreated
spring.jpa.hibernate.ddl-auto=update

# JANKY WORK AROUNDS THAT I DO NOT UNDERSTAND BUT WORK --- THANK YOU BEN

# Janky workaround for the barebones demo to work before spring security----------
spring.mvc.dispatch-options-request=true

# JWT settings ------------------------------------------------------------
# Signing key: base64, at least 32 bytes. Set the JWT_SECRET env variable to override.
# The value after the colon is a DEV-ONLY fallback - use a different secret anywhere real.
# Generate a new one with:  openssl rand -base64 32
jwt.secret=${JWT_SECRET:ynfmU4XSrCpz44kjb+MQJ3WklgV18HigL2hPMfb9SwY=}

# How long a token lasts, in milliseconds (3600000 = 1 hour)
jwt.expiration-ms=3600000
